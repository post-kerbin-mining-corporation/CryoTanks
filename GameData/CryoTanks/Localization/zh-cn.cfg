    // PARTS
    #LOC_CryoTanks_hydrogen-10-1_title = H1000-1152 低温燃料箱
    #LOC_CryoTanks_hydrogen-10-1_description = Argyle Hydroponics 公司提供的最大型低温燃料箱，容量惊人，但对于这个体积来说重量却相当轻。采用隔热层和先进材料，降低冷却燃料箱所需的功率。
    #LOC_CryoTanks_hydrogen-10-1_tags = fueltank oxidizer propellant rocket hydrogen methane cryo

    #LOC_CryoTanks_hydrogen-5-1_title = H500-576 低温燃料箱
    #LOC_CryoTanks_hydrogen-5-1_description = 超大容量的低温燃料箱，可存储低温燃料。采用隔热层和先进材料，降低冷却燃料箱所需的功率。
    #LOC_CryoTanks_hydrogen-5-1_tags = fueltank oxidizer propellant rocket hydrogen methane cryo
    #LOC_CryoTanks_hydrogen-5-2_title = H500-288 低温燃料箱
    #LOC_CryoTanks_hydrogen-5-2_description = 巨大的低温燃料箱，可存储低温燃料。采用隔热层和先进材料，降低冷却燃料箱所需的功率。
    #LOC_CryoTanks_hydrogen-5-2_tags = fueltank oxidizer propellant rocket hydrogen methane cryo
    #LOC_CryoTanks_hydrogen-5-3_title = H500-144 低温燃料箱
    #LOC_CryoTanks_hydrogen-5-3_description = 相当大的低温燃料箱，可存储低温燃料。采用隔热层和先进材料，降低冷却燃料箱所需的功率。
    #LOC_CryoTanks_hydrogen-5-3_tags = fueltank oxidizer propellant rocket hydrogen methane cryo

    #LOC_CryoTanks_hydrogen-375-1_title = H375-144 低温燃料箱
    #LOC_CryoTanks_hydrogen-375-1_description = Argyle 公司的“Mondo”系列低温燃料箱，正如其名，巨大无比。采用隔热层和先进材料，降低冷却燃料箱所需的功率。
    #LOC_CryoTanks_hydrogen-375-1_tags = fueltank oxidizer propellant rocket hydrogen methane cryo
    #LOC_CryoTanks_hydrogen-375-2_title = H375-72 低温燃料箱
    #LOC_CryoTanks_hydrogen-375-2_description = 由于半尺寸 Mondo 燃料箱需求很高，于是诞生了 Mondo-30。它只是稍微矮了一点。采用隔热层和先进材料，降低冷却燃料箱所需的功率。
    #LOC_CryoTanks_hydrogen-375-2_tags = fueltank oxidizer propellant rocket hydrogen methane cryo
    #LOC_CryoTanks_hydrogen-375-3_title = H375-36 低温燃料箱
    #LOC_CryoTanks_hydrogen-375-3_description = Mondo 系列中最小的型号，看起来有些褶皱，但依然完全可用。采用隔热层和先进材料，降低冷却燃料箱所需的功率。
    #LOC_CryoTanks_hydrogen-375-3_tags = fueltank oxidizer propellant rocket hydrogen methane cryo

    #LOC_CryoTanks_hydrogen-25-1_title = H250-64 低温燃料箱
    #LOC_CryoTanks_hydrogen-25-1_description = Argyle 公司的中型燃料箱系列并不特别，甚至没获得一个引人注目的名字！采用隔热层和先进材料，降低冷却燃料箱所需的功率。
    #LOC_CryoTanks_hydrogen-25-1_tags = fueltank oxidizer propellant rocket hydrogen methane cryo
    #LOC_CryoTanks_hydrogen-25-2_title = H250-32 低温燃料箱
    #LOC_CryoTanks_hydrogen-25-2_description = 中等尺寸、中等容量、中等价格，甚至连位置都很中庸！采用隔热层和先进材料，降低冷却燃料箱所需的功率。
    #LOC_CryoTanks_hydrogen-25-2_tags = fueltank oxidizer propellant rocket hydrogen methane cryo
    #LOC_CryoTanks_hydrogen-25-3_title = H250-16 低温燃料箱
    #LOC_CryoTanks_hydrogen-25-3_description = 中等直径与较短的高度让 HI-M-5 的容量几乎令人失望。不过！它采用隔热层和先进材料，降低冷却燃料箱所需的功率，这也算是个优点。
    #LOC_CryoTanks_hydrogen-25-3_tags = fueltank oxidizer propellant rocket hydrogen methane cryo

    #LOC_CryoTanks_hydrogen-125-1_title = H125-8 低温燃料箱
    #LOC_CryoTanks_hydrogen-125-1_description = 这只燃料箱的几乎全新外观有点可疑，考虑到它是原封包装送到 KSC 的。采用隔热层和先进材料，降低冷却燃料箱所需的功率。
    #LOC_CryoTanks_hydrogen-125-1_tags = fueltank oxidizer propellant rocket hydrogen methane cryo
    #LOC_CryoTanks_hydrogen-125-2_title = H125-4 低温燃料箱
    #LOC_CryoTanks_hydrogen-125-2_description = 用于存储低温燃料的最小可堆叠燃料箱，并不是最受欢迎的型号。采用隔热层和先进材料，降低冷却燃料箱所需的功率。
    #LOC_CryoTanks_hydrogen-125-2_tags = fueltank oxidizer propellant rocket hydrogen methane cryo

    #LOC_CryoTanks_hydrogen-radial-125-1_title = HR-1 低温燃料箱
    #LOC_CryoTanks_hydrogen-radial-125-1_description = 在 KSC 员工中被亲切地称为“生日快乐燃料箱”。当一位工程师尝试把装满燃料的它当作蛋糕（还插上了蜡烛）使用时，造成了 57 人受伤。采用隔热层和先进材料，降低冷却燃料箱所需的功率。
    #LOC_CryoTanks_hydrogen-radial-125-1_tags = fueltank oxidizer propellant rocket hydrogen methane cryo
    #LOC_CryoTanks_hydrogen-radial-25-1_title = HR-18 低温燃料箱
    #LOC_CryoTanks_hydrogen-radial-25-1_description = 大型低温燃料箱。强度并不算高，但评论中出现了“惊艳”、“巨大”和“漏液”等字眼。等下，我是不是不该说漏液？采用隔热层和先进材料，降低冷却燃料箱所需的功率。
    #LOC_CryoTanks_hydrogen-radial-25-1_tags = fueltank oxidizer propellant rocket hydrogen methane cryo
    #LOC_CryoTanks_hydrogen-radial-375-1_title = HR-64 低温燃料箱
    #LOC_CryoTanks_hydrogen-radial-375-1_description = 这款燃料箱的诞生源于Argyle 公司首席工程师在绘制 HB-8 蓝图时意外地将半径加倍。几打产品建成并获得一致好评后，它被列入量产计划。采用隔热层和先进材料，降低冷却燃料箱所需的功率。
    #LOC_CryoTanks_hydrogen-radial-375-1_tags = fueltank oxidizer propellant rocket hydrogen methane cryo

